<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Module-complete celebrations (concepts)</title>
<link rel="stylesheet" href="../css/styles.css"><link rel="stylesheet" href="../css/cyberpunk.css">
<style>
.demo{max-width:900px;margin:40px auto;padding:0 20px}
.demo .btn-row{gap:12px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:500}
.fx-layer{position:fixed;inset:0;pointer-events:none;z-index:600;display:grid;place-items:center;overflow:hidden}
/* A. glitch banner */
.banner{position:absolute;left:0;right:0;top:38%;padding:22px 0;text-align:center;background:linear-gradient(90deg,transparent,rgba(5,6,15,.92) 12%,rgba(5,6,15,.92) 88%,transparent);
 border-top:2px solid var(--c);border-bottom:2px solid var(--c);box-shadow:0 0 40px color-mix(in srgb,var(--c) 45%,transparent);animation:bn-in .5s cubic-bezier(.2,.9,.3,1.2) both,bn-out .4s ease-in 3.2s forwards}
.banner small{display:block;font-family:var(--mono);letter-spacing:.4em;color:var(--c);font-size:.85rem}
.banner b{display:block;font-family:var(--display);font-weight:900;font-size:clamp(28px,6vw,64px);letter-spacing:.08em;color:#fff;text-shadow:0 0 12px var(--c),3px 0 #ff2bd6,-3px 0 #00f0ff;animation:glitch 1.2s steps(2) 3}
.banner em{display:block;font-style:normal;font-family:var(--mono);color:#cfd6ff;margin-top:6px}
@keyframes bn-in{from{transform:translateX(-110%) skewX(-20deg)}to{transform:none}}
@keyframes bn-out{to{transform:translateX(110%) skewX(20deg);opacity:0}}
@keyframes glitch{0%{clip-path:inset(0 0 0 0)}25%{clip-path:inset(20% 0 55% 0);transform:translateX(-6px)}50%{clip-path:inset(60% 0 10% 0);transform:translateX(6px)}75%{clip-path:inset(0 0 0 0);transform:none}}
/* C. circuit power-up */
.chip{position:relative;width:180px;height:180px;display:grid;place-items:center;border:2px solid var(--c);background:#05060f;clip-path:polygon(15% 0,85% 0,100% 15%,100% 85%,85% 100%,15% 100%,0 85%,0 15%);
 box-shadow:inset 0 0 30px color-mix(in srgb,var(--c) 40%,transparent);opacity:0;animation:chip-on .4s 1.1s forwards, chip-pulse .6s 1.5s 3}
.chip span{font-family:var(--display);font-weight:900;font-size:44px;color:var(--c);text-shadow:0 0 14px var(--c)}
.chip i{position:absolute;bottom:18px;font-style:normal;font-family:var(--mono);font-size:.8rem;letter-spacing:.3em;color:#fff}
.traces{position:absolute;inset:0;width:100%;height:100%}
.traces path{fill:none;stroke:var(--c);stroke-width:3;filter:drop-shadow(0 0 6px var(--c));stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1.2s ease-out forwards}
.traces circle{fill:var(--c);opacity:0;animation:fadein .2s 1.1s forwards}
@keyframes draw{to{stroke-dashoffset:0}} @keyframes fadein{to{opacity:1}}
@keyframes chip-on{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes chip-pulse{50%{box-shadow:inset 0 0 60px var(--c),0 0 60px var(--c)}}
.fade-all{animation:fadeout .5s 3.4s forwards} @keyframes fadeout{to{opacity:0}}
/* E. scope pulse */
.scope-trace{position:absolute;left:0;top:8vh;width:100%;height:40vh}
.scope-trace .grat{stroke:color-mix(in srgb,var(--c) 18%,transparent);stroke-width:1}
.scope-trace .sig{fill:none;stroke:var(--c);stroke-width:3;stroke-linejoin:round;filter:drop-shadow(0 0 6px var(--c));stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s linear forwards}
.scope-trace .dot{fill:#fff;filter:drop-shadow(0 0 8px var(--c));offset-rotate:0deg;animation:fadein .1s forwards}
.scope-banner{position:absolute;transform-origin:50% 0;white-space:nowrap;left:50%;top:var(--sy);transform:translate(-50%,0) scaleY(.02) scaleX(.05);opacity:0;padding:16px 40px;text-align:center;background:rgba(5,6,15,.94);
 border:2px solid var(--c);box-shadow:0 0 40px color-mix(in srgb,var(--c) 55%,transparent);animation:spike-open .5s cubic-bezier(.2,.9,.3,1.3) 1.05s forwards}
.scope-banner small{display:block;font-family:var(--mono);letter-spacing:.4em;color:var(--c);font-size:.8rem}
.scope-banner b{display:block;font-family:var(--display);font-weight:900;font-size:clamp(24px,5vw,52px);letter-spacing:.08em;color:#fff;text-shadow:0 0 12px var(--c)}
.scope-banner em{display:block;font-style:normal;font-family:var(--mono);color:#cfd6ff;margin-top:4px;font-size:.85rem}
@keyframes spike-open{0%{opacity:1;transform:translate(-50%,0) scaleY(1.6) scaleX(.02)}60%{transform:translate(-50%,0) scaleY(.9) scaleX(1.05)}100%{opacity:1;transform:translate(-50%,0)}}
.scope-out{animation:fadeout .4s 2.6s forwards}
/* D. Volt victory lap */
.volt{width:150px;height:150px;animation:volt-fly 3.6s ease-in-out forwards}
.volt svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 12px var(--c))}
.volt-say{position:absolute;top:calc(50% + 90px);font-family:var(--display);font-weight:900;font-size:28px;color:var(--c);text-shadow:0 0 10px var(--c);opacity:0;animation:fadein .3s 1s forwards}
@keyframes volt-fly{0%{transform:translate(45vw,45vh) scale(.3)}25%{transform:none}35%{transform:rotate(-12deg) translateY(-20px)}45%{transform:rotate(12deg) translateY(-30px)}55%{transform:rotate(-360deg) translateY(-20px)}70%{transform:none}90%{transform:none;opacity:1}100%{transform:translate(45vw,45vh) scale(.3);opacity:0}}
.volt .g-halo{fill:none;stroke:var(--c);stroke-dasharray:4 3}.volt .g-head{fill:#0d1030;stroke:var(--c);stroke-width:2}.volt .g-face{fill:#02030a}.volt .g-eyes ellipse,.volt .g-node{fill:var(--c)}
.volt .g-mouth{fill:var(--c)}.volt .g-trace,.volt .g-antenna{fill:none;stroke:var(--c);stroke-width:1.5}.volt .g-ear{fill:#0d1030;stroke:var(--c)}.volt .g-bolt{fill:#f9f871}.volt .g-cheek{fill:#ff2bd6}
</style></head>
<body><div class="demo">
<div class="card"><p class="eyebrow">Concepts for Dwight</p><h1>Module complete</h1>
<p>Each button plays one idea. "Mix" picks a random combo, the way a real module completion would.</p>
<label class="field"><span>Phase color</span><select id="phase"><option value="#00f0ff">Phase 1 cyan</option><option value="#ff2bd6">Phase 2 magenta</option><option value="#f9f871">Phase 3 yellow</option><option value="#a259ff">Phase 4 violet</option></select></label>
<div class="btn-row"><button class="btn" data-fx="fireworks">A. Neon fireworks</button><button class="btn" data-fx="banner">B. Glitch banner</button>
<button class="btn" data-fx="circuit">C. Circuit power-up</button><button class="btn" data-fx="volt">D. Volt victory lap</button><button class="btn" data-fx="scope">E. Scope pulse</button>
<button class="btn secondary" data-fx="mix">Mix (random)</button><button class="btn secondary" data-fx="finale">Phase finale (all)</button></div></div></div>
<canvas id="fx"></canvas>
<script>
const $=s=>document.querySelector(s), cv=$('#fx'), ctx=cv.getContext('2d'); let parts=[], raf=0;
window.dbg=()=>parts.length; const PAL=['#00f0ff','#ff2bd6','#f9f871','#a259ff','#39ff88'];
function size(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)} size(); addEventListener('resize',size);
function col(){return $('#phase').value}
function mod(){const n=1+Math.floor(Math.random()*20);return {id:'M'+n,name:['Hand Soldering I','DC Circuit Analysis','ESD Control','Oscilloscope Basics','Troubleshooting'][n%5]}}
let pend=[];function burst(x,y,c){for(let i=0;i<90;i++){const a=Math.random()*6.283,s=2+Math.random()*5;pend.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:60+Math.random()*30,c:Math.random()<.6?c:PAL[i%5]})}}
function rocket(){const x=innerWidth*(.15+Math.random()*.7),ty=innerHeight*(.15+Math.random()*.35);parts.push({x,y:innerHeight,vx:0,vy:-(innerHeight-ty)/40,l:40,c:'#fff',rk:1})}
function loop(){ctx.globalCompositeOperation='destination-out';ctx.fillStyle='rgba(0,0,0,.18)';ctx.fillRect(0,0,innerWidth,innerHeight);ctx.globalCompositeOperation='lighter';
 parts=parts.concat(pend);pend=[];
 parts=parts.filter(p=>{p.x+=p.vx;p.y+=p.vy;if(!p.rk){p.vy+=.06;p.vx*=.985;p.vy*=.985}p.l--;if(p.rk&&p.l<=0){burst(p.x,p.y,col());return false}
 ctx.fillStyle=p.c;ctx.shadowColor=p.c;ctx.shadowBlur=12;ctx.fillRect(p.x,p.y,p.rk?3:2.5,p.rk?8:2.5);return p.l>0}).concat(pend);pend=[];
 if(parts.length)raf=requestAnimationFrame(loop);else{ctx.clearRect(0,0,innerWidth,innerHeight);raf=0}}
function fireworks(n=6){for(let i=0;i<n;i++)setTimeout(rocket,i*380);if(!raf)loop();setTimeout(()=>{if(!raf)loop()},50)}
function layer(html,ms=4000){const d=document.createElement('div');d.className='fx-layer';d.style.setProperty('--c',col());d.innerHTML=html;document.body.appendChild(d);setTimeout(()=>d.remove(),ms);return d}
function banner(){const m=mod();layer(`<div class="banner"><small>// MODULE COMPLETE</small><b>${m.id} UNLOCKED</b><em>${m.name} · written test ✓ · hours credited ✓</em></div>`)}
function circuit(){const W=innerWidth,H=innerHeight,cx=W/2,cy=H/2;const ps=[[0,H*.2,cx-200,H*.2,cx-200,cy,cx-90,cy],[W,H*.8,cx+220,H*.8,cx+220,cy,cx+90,cy],[W*.3,0,W*.3,cy-160,cx,cy-160,cx,cy-90],[W*.7,H,W*.7,cy+170,cx,cy+170,cx,cy+90]];
 const d=ps.map(p=>`M${p[0]} ${p[1]} L${p[2]} ${p[3]} L${p[4]} ${p[5]} L${p[6]} ${p[7]}`).map(x=>`<path d="${x}"/>`).join('');const dots=ps.map(p=>`<circle cx="${p[2]}" cy="${p[3]}" r="5"/><circle cx="${p[4]}" cy="${p[5]}" r="5"/>`).join('');
 const m=mod();layer(`<div class="fade-all" style="position:absolute;inset:0;display:grid;place-items:center"><svg class="traces">${d}${dots}</svg><div class="chip"><span>${m.id}</span><i>ONLINE</i></div></div>`)}
function scope(){const W=innerWidth,H=innerHeight*.4,mid=H*.55,cx=W/2;let pts=[];
 for(let x=0;x<=W;x+=6){let y=mid+Math.sin(x/38)*H*.06;const d=Math.abs(x-cx);if(d<60)y=mid-(1-d/60)*(mid-H*.08);pts.push(x.toFixed(0)+','+y.toFixed(1))}
 let g='';for(let i=1;i<10;i++)g+=`<line class="grat" x1="${W*i/10}" y1="0" x2="${W*i/10}" y2="${H}"/>`;for(let i=1;i<5;i++)g+=`<line class="grat" x1="0" y1="${H*i/5}" x2="${W}" y2="${H*i/5}"/>`;
 const m=mod();layer(`<div class="scope-out" style="position:absolute;inset:0;--sy:calc(8vh + ${(H*.08).toFixed(0)}px)"><svg class="scope-trace" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${g}<polyline class="sig" pathLength="1" points="${pts.join(' ')}"/></svg>
 <div class="scope-banner"><small>// SIGNAL LOCKED</small><b>MODULE COMPLETE</b><em>${m.id} · ${m.name}</em></div></div>`,3200)}
const VOLT=`<svg viewBox="0 0 64 64"><polygon class="g-halo" points="32,4 58,19 58,49 32,64 6,49 6,19"/><line class="g-antenna" x1="32" y1="20" x2="32" y2="11"/><path class="g-bolt" d="M34 0 L27 9 H31.5 L29 15 L37 6 H32.5 Z"/><polygon class="g-ear" points="10,30 4,34 4,44 10,48"/><polygon class="g-ear" points="54,30 60,34 60,44 54,48"/><path class="g-head" d="M19 20 H45 L54 29 V47 L45 56 H19 L10 47 V29 Z"/><path class="g-trace" d="M19 20 V25 H24 M45 20 V25 H40 M19 56 V52 H26 M45 56 V52 H38"/><path class="g-face" d="M15 30 H49 L46 47 H18 Z"/><g class="g-eyes"><ellipse cx="25.5" cy="36" rx="3.6" ry="1.6"/><ellipse cx="38.5" cy="36" rx="3.6" ry="1.6"/></g><path class="g-mouth" d="M27.5 41 Q32 46 36.5 41 Z"/><rect class="g-cheek" x="18" y="40.5" width="3" height="1.6"/><rect class="g-cheek" x="43" y="40.5" width="3" height="1.6"/></svg>`;
function volt(){layer(`<div class="volt">${VOLT}</div><div class="volt-say">NICE WORK!</div>`,3800);setTimeout(()=>{burst(innerWidth/2,innerHeight/2,col());if(!raf)loop()},1700)}
const FX={fireworks,banner,circuit,volt,scope,
 mix(){banner();const pick=[fireworks,circuit,volt,scope][Math.floor(Math.random()*3)];setTimeout(pick,pick===fireworks?300:3600)},
 finale(){circuit();setTimeout(()=>{banner();fireworks(10)},3500);setTimeout(volt,7600)}};
document.querySelectorAll('[data-fx]').forEach(b=>b.onclick=()=>FX[b.dataset.fx]());
window.FX=FX;
</script></body></html>
